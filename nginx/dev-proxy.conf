# ============================================================
# 本地开发统一反向代理
# 浏览器输入域名即可访问对应服务，无需记端口号
#
# 域名 → 服务映射：
#   eval.test          → eval-boot (8080)
#   eval-answer.test   → eval-answer-boot (8081)
#   eval-mcp.test      → eval-mcp-server (8083)
#   eval-answer-ui.test → eval-answer-ui (8030)
#   perm.test          → perm-boot (8180)
#   bizgraph.test      → bizgraph-new (8283)
#   basedata.test      → basedata-boot (8380)
#   portainer.test     → portainer (9000)
#   admin.test         → admin-server (9001)
#
# 使用前需配置 /etc/hosts，运行：./cicd/scripts/setup-proxy.sh
# ============================================================

# ==================== Eval ====================
server {
    listen 80;
    server_name eval.test;

    location / {
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}

