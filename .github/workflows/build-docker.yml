name: Build Docker Image

on:
  workflow_call:
    inputs:
      image-name:
        type: string
        required: true
        description: "Docker image name, e.g. eval/backend"
      dockerfile-path:
        type: string
        required: true
        description: "Path to Dockerfile, e.g. docker/Dockerfile.backend"
      docker-context:
        type: string
        default: "."
        description: "Docker build context"
      download-artifact-name:
        type: string
        default: ""
        description: "If set, download artifact before building"
      push-image:
        type: boolean
        default: true
        description: "Whether to push the image to the registry"
      tags-extra:
        type: string
        default: ""
        description: "Additional tags for the image"
    secrets:
      DOCKER_REGISTRY:
        required: false
      DOCKER_USERNAME:
        required: false
      DOCKER_PASSWORD:
        required: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        if: inputs.download-artifact-name != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.download-artifact-name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_REGISTRY || 'ghcr.io' }}
          username: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_USERNAME || github.actor }}
          password: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_REGISTRY || 'ghcr.io' }}/${{ github.repository_owner }}/${{ inputs.image-name }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            ${{ inputs.tags-extra }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.docker-context }}
          file: ${{ inputs.dockerfile-path }}
          push: ${{ inputs.push-image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image digest
        run: echo "Image digest ${{ steps.build.outputs.digest }}"
