name: Build Java Maven

on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: "21"
      maven-modules:
        type: string
        required: true
      run-integration-tests:
        type: boolean
        default: false
      maven-args:
        type: string
        default: ""
      artifact-prefix:
        type: string
        default: "build"
      standalone-modules:
        type: string
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin
          cache: maven

      - name: Install root reactor dependencies
        if: inputs.standalone-modules != ''
        run: mvn install -B -Dmaven.test.skip=true ${{ inputs.maven-args }}

      - name: Compile
        if: inputs.standalone-modules == ''
        run: mvn compile -B -pl ${{ inputs.maven-modules }} -am ${{ inputs.maven-args }}

      - name: Unit Tests
        if: inputs.standalone-modules == ''
        run: mvn test -B -pl ${{ inputs.maven-modules }} -am ${{ inputs.maven-args }}

      - name: Integration Tests
        if: inputs.standalone-modules == '' && inputs.run-integration-tests
        run: mvn verify -B -pl ${{ inputs.maven-modules }} -am -DskipUnitTests ${{ inputs.maven-args }}

      - name: Package
        if: inputs.standalone-modules == ''
        run: mvn package -B -DskipTests -pl ${{ inputs.maven-modules }} -am ${{ inputs.maven-args }}

      - name: Compile (standalone)
        if: inputs.standalone-modules != ''
        run: |
          IFS=',' read -ra MODULES <<< "${{ inputs.standalone-modules }}"
          for module in "${MODULES[@]}"; do
            mvn compile -B -f "$module/pom.xml" ${{ inputs.maven-args }}
          done

      - name: Unit Tests (standalone)
        if: inputs.standalone-modules != ''
        run: |
          IFS=',' read -ra MODULES <<< "${{ inputs.standalone-modules }}"
          for module in "${MODULES[@]}"; do
            mvn test -B -f "$module/pom.xml" ${{ inputs.maven-args }}
          done

      - name: Integration Tests (standalone)
        if: inputs.standalone-modules != '' && inputs.run-integration-tests
        run: |
          IFS=',' read -ra MODULES <<< "${{ inputs.standalone-modules }}"
          for module in "${MODULES[@]}"; do
            mvn verify -B -f "$module/pom.xml" -DskipUnitTests ${{ inputs.maven-args }}
          done

      - name: Package (standalone)
        if: inputs.standalone-modules != ''
        run: |
          IFS=',' read -ra MODULES <<< "${{ inputs.standalone-modules }}"
          for module in "${MODULES[@]}"; do
            mvn package -B -DskipTests -f "$module/pom.xml" ${{ inputs.maven-args }}
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-prefix }}-artifacts
          path: "**/target/*.jar"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.artifact-prefix }}-surefire-reports
          path: "**/target/surefire-reports/"
