# ⚠️ 已迁移：此文件仅用于 bizgraph 全栈联调
# 新的统一编排请使用根目录的 docker-compose.infra.yml + docker-compose.apps.yml
# 启动方式：./cicd/scripts/start-app.sh bizgraph
#
# ============================================================
# 全栈联调模式：Docker 起全部服务 + Nginx 统一入口
# ============================================================
# 用法：docker compose up -d
#
# 访问：
#   http://localhost          → 前端页面（Nginx 反代）
#   http://localhost/api/...  → 后端 API（Nginx 转发）
#   http://localhost:8080     → 后端直连（调试用）
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: bizgraph-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bizgraph
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ${BIZGRAPH_HOME:-../bizgraph}
      dockerfile: Dockerfile
    container_name: bizgraph-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bizgraph
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ${BIZGRAPH_HOME:-../bizgraph}/frontend
      dockerfile: Dockerfile
    container_name: bizgraph-frontend
    volumes:
      - ./nginx/bizgraph.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
