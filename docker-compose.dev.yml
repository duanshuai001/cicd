# 新的统一基础设施请使用根目录的 docker-compose.infra.yml
# 启动方式：./cicd/scripts/start-infra.sh
#
# ============================================================
# 本地开发模式：只起基础设施，应用在本地 IDE / 终端直启
# ============================================================
# 用法：docker compose -f docker-compose.dev.yml up -d
#
# 启动后：
#   后端：IDE 中启动 BizGraphApplication，profile=local
#   前端：cd frontend && npm run dev
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: bizgraph-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bizgraph
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
